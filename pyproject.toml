[project]
name = "dingyue-check"
version = "0.1.0"
description = "Telegram subscription checking and conversion bot"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "anronharry" },
]
dependencies = [
  "python-telegram-bot[job-queue]==20.7",
  "python-dotenv==1.0.0",
  "PyYAML==6.0.1",
  "aiohttp>=3.9.0,<4",
  "aiofiles>=23.2.1,<24",
  "psutil==5.9.8",
  "colorama>=0.4.6,<1",
  "urllib3>=1.26.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]
redis = [
  "redis>=5,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "__pycache__", ".pytest_cache", "pytest-cache-files-*"]
asyncio_mode = "auto"
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Start with a small, enforceable baseline. Broader style rules will be enabled
# after existing violations are reduced in focused follow-up changes.
select = ["F821", "F822", "F823"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
